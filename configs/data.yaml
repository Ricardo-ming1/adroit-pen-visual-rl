project: Adroit Pen Reorientation
dataset_id: D4RL/pen/human-v2
dataset_path: data/minari
output_path: data/processed/pen_human_visual.hdf5
validation_path: results/data_validation.json
sample_dir: results/data_samples
environment_id: AdroitHandPen-v1
reward_type: dense
horizon: 200
image_size: 84
frame_stack: 4
camera:
  camera_id: -1
  distance: 1.0
  azimuth: -45.0
  elevation: -25.0
